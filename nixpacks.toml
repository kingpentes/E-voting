
[phases.install]
cmds = [
    "mkdir -p bootstrap/cache storage/framework/views storage/framework/sessions storage/framework/cache storage/app/public",
    "chmod -R 777 bootstrap/cache storage",
    "npm install"
]

[start]
cmd = "php artisan optimize:clear && php artisan migrate --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"

